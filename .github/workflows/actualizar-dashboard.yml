name: Actualizar dashboard LinkedIn

on:
  push:
    paths:
      - "reporte/*.xlsx"
      - "reporte/*.xlsm"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install openpyxl

      - name: Crear conversor
        shell: bash
        run: |
          cat > convertir.py <<'PY'
          import json
          import os
          from datetime import datetime, date
          from openpyxl import load_workbook

          MESES = [
              "Ene", "Feb", "Mar", "Abr", "May", "Jun",
              "Jul", "Ago", "Sep", "Oct", "Nov", "Dic"
          ]

          def numero(valor):
              if valor is None or valor == "":
                  return 0

              if isinstance(valor, (int, float)):
                  return valor

              texto = str(valor).strip().replace("%", "").replace(" ", "")

              if not texto:
                  return 0

              try:
                  if "," in texto and "." in texto:
                      if texto.rfind(",") > texto.rfind("."):
                          texto = texto.replace(".", "").replace(",", ".")
                      else:
                          texto = texto.replace(",", "")
                  elif "," in texto:
                      texto = texto.replace(",", ".")

                  return float(texto)
              except:
                  return 0

          def entero(valor):
              return round(numero(valor))

          def fecha(valor):
              if valor is None or valor == "":
                  return None

              if isinstance(valor, datetime):
                  return date(valor.year, valor.month, valor.day)

              if isinstance(valor, date):
                  return valor

              texto = str(valor).strip()

              formatos = [
                  "%Y-%m-%d",
                  "%Y/%m/%d",
                  "%m/%d/%Y",
                  "%m/%d/%Y %H:%M:%S",
                  "%Y-%m-%d %H:%M:%S"
              ]

              for formato in formatos:
                  try:
                      return datetime.strptime(texto, formato).date()
                  except:
                      pass

              return None

          def buscar_encabezados(ws, requeridos):
              for fila in range(1, min(ws.max_row, 15) + 1):
                  valores = [
                      str(ws.cell(fila, columna).value or "").strip()
                      for columna in range(1, ws.max_column + 1)
                  ]

                  if all(campo in valores for campo in requeridos):
                      return fila, {
                          valor: indice + 1
                          for indice, valor in enumerate(valores)
                          if valor
                      }

              raise Exception(
                  "No se encontró la fila de encabezados esperada."
              )

          def filas(ws, fila_encabezado, columnas):
              resultado = []

              for fila in range(fila_encabezado + 1, ws.max_row + 1):
                  registro = {}

                  for nombre, columna in columnas.items():
                      registro[nombre] = ws.cell(fila, columna).value

                  if any(
                      valor is not None and valor != ""
                      for valor in registro.values()
                  ):
                      resultado.append(registro)

              return resultado

          def resumen(registros):
              cantidad = len(registros) or 1

              return {
                  "impressions": entero(sum(
                      numero(r.get("Impresiones (totales)"))
                      for r in registros
                  )),
                  "clicks": entero(sum(
                      numero(r.get("Clics (totales)"))
                      for r in registros
                  )),
                  "rate": sum(
                      numero(r.get("Tasa de interacción (total)"))
                      for r in registros
                  ) / cantidad,
                  "conversions": 0,
                  "days": len(registros),
                  "reactions": entero(sum(
                      numero(r.get("Reacciones (total)"))
                      for r in registros
                  )),
                  "comments": entero(sum(
                      numero(r.get("Comentarios (totales)"))
                      for r in registros
                  )),
                  "shares": entero(sum(
                      numero(r.get("Veces compartido (total)"))
                      for r in registros
                  ))
              }

          # ---------------------------------------------------------
          # Buscar automáticamente el Excel dentro de /reporte
          # ---------------------------------------------------------

          archivos = [
              nombre
              for nombre in os.listdir("reporte")
              if nombre.lower().endswith((".xlsx", ".xlsm"))
          ]

          if not archivos:
              raise Exception(
                  "No se encontró ningún archivo Excel dentro de reporte/."
              )

          # Usamos el archivo modificado más recientemente
          archivos.sort(
              key=lambda nombre: os.path.getmtime(
                  os.path.join("reporte", nombre)
              ),
              reverse=True
          )

          archivo = os.path.join("reporte", archivos[0])

          print(f"Excel encontrado: {archivo}")

          wb = load_workbook(
              archivo,
              data_only=True,
              read_only=True
          )

          # ---------------------------------------------------------
          # HOJA INDICADORES
          # ---------------------------------------------------------

          if "Indicadores" not in wb.sheetnames:
              raise Exception(
                  'No se encontró la hoja "Indicadores".'
              )

          ws = wb["Indicadores"]

          fila, columnas = buscar_encabezados(
              ws,
              [
                  "Fecha",
                  "Impresiones (totales)",
                  "Clics (totales)",
                  "Tasa de interacción (total)"
              ]
          )

          indicadores = filas(ws, fila, columnas)

          indicadores = [
              registro
              for registro in indicadores
              if fecha(registro.get("Fecha")) is not None
          ]

          for registro in indicadores:
              registro["Fecha"] = fecha(registro["Fecha"])

          indicadores.sort(key=lambda r: r["Fecha"])

          if not indicadores:
              raise Exception(
                  "La hoja Indicadores no contiene fechas válidas."
              )

          # ---------------------------------------------------------
          # RESUMEN ANUAL
          # ---------------------------------------------------------

          years = sorted(
              set(registro["Fecha"].year for registro in indicadores)
          )

          annual = {}

          for year in years:
              annual[str(year)] = resumen([
                  r for r in indicadores
                  if r["Fecha"].year == year
              ])

          annual["all"] = resumen(indicadores)

          # ---------------------------------------------------------
          # RESUMEN MENSUAL
          # ---------------------------------------------------------

          grupos = {}

          for registro in indicadores:
              year = registro["Fecha"].year
              month = registro["Fecha"].month

              clave = f"{year}-{month:02d}"

              if clave not in grupos:
                  grupos[clave] = []

              grupos[clave].append(registro)

          months = []

          for clave in sorted(grupos.keys()):
              registros = grupos[clave]

              year, month = map(int, clave.split("-"))

              cantidad = len(registros) or 1

              interacciones = sum(
                  numero(r.get("Reacciones (total)"))
                  + numero(r.get("Comentarios (totales)"))
                  + numero(r.get("Veces compartido (total)"))
                  for r in registros
              )

              months.append([
                  f"{MESES[month - 1]} {str(year)[-2:]}",
                  year,
                  entero(sum(
                      numero(r.get("Impresiones (totales)"))
                      for r in registros
                  )),
                  entero(sum(
                      numero(r.get("Clics (totales)"))
                      for r in registros
                  )),
                  entero(interacciones),
                  entero(sum(
                      numero(r.get("Comentarios (totales)"))
                      for r in registros
                  )),
                  entero(sum(
                      numero(r.get("Veces compartido (total)"))
                      for r in registros
                  )),
                  sum(
                      numero(r.get("Tasa de interacción (total)"))
                      for r in registros
                  ) / cantidad
              ])

          # ---------------------------------------------------------
          # HOJA TODAS LAS PUBLICACIONES
          # ---------------------------------------------------------

          posts = []

          if "Todas las publicaciones" in wb.sheetnames:
              ws_posts = wb["Todas las publicaciones"]

              fila_posts, columnas_posts = buscar_encabezados(
                  ws_posts,
                  [
                      "Título de la publicación",
                      "Fecha de creación",
                      "Impresiones",
                      "Clics",
                      "Tasa de interacción"
                  ]
              )

              publicaciones = filas(
                  ws_posts,
                  fila_posts,
                  columnas_posts
              )

              for publicacion in publicaciones:
                  titulo = (
                      publicacion.get("Título de la publicación")
                      or ""
                  )

                  if not titulo:
                      continue

                  fecha_publicacion = fecha(
                      publicacion.get("Fecha de creación")
                  )

                  fecha_texto = ""

                  if fecha_publicacion:
                      fecha_texto = fecha_publicacion.strftime(
                          "%d/%m/%Y"
                      )
                  else:
                      fecha_texto = str(
                          publicacion.get("Fecha de creación") or ""
                      )

                  posts.append([
                      titulo,
                      fecha_texto,
                      publicacion.get("Tipo de publicación") or "",
                      entero(publicacion.get("Impresiones")),
                      entero(publicacion.get("Clics")),
                      numero(
                          publicacion.get("Tasa de interacción")
                      )
                  ])

          # ---------------------------------------------------------
          # CREAR JSON
          # ---------------------------------------------------------

          resultado = {
              "annual": annual,
              "months": months,
              "posts": posts
          }

          with open(
              "data.json",
              "w",
              encoding="utf-8"
          ) as archivo_json:
              json.dump(
                  resultado,
                  archivo_json,
                  ensure_ascii=False,
                  indent=2
              )

          print("====================================")
          print("Conversión completada correctamente")
          print(f"Archivo: {archivo}")
          print(f"Años: {years}")
          print(f"Días: {len(indicadores)}")
          print(f"Meses: {len(months)}")
          print(f"Publicaciones: {len(posts)}")
          print(f"Impresiones: {annual['all']['impressions']}")
          print(f"Clics: {annual['all']['clicks']}")
          print(f"Interacción: {annual['all']['rate']}")
          print("====================================")
          PY

      - name: Convertir Excel a JSON
        run: python convertir.py

      - name: Guardar data.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data.json

          if git diff --cached --quiet; then
            echo "No hubo cambios en data.json"
          else
            git commit -m "Actualizar data.json desde LinkedIn"
            git push
          fi
